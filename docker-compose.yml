

services:
  prime-agent:
    build: .
    container_name: prime-agent
    volumes:
      - prime-data:/app/data
      # Mount the current directory as workspace for the agent to work on
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - TERM=xterm-256color
    command: ["--provider", "${PRIME_PROVIDER:-openrouter}", "--model", "${PRIME_MODEL:-meta-llama/llama-3.1-8b-instruct:free}"]

volumes:
  prime-data:
