

services:
  prime-agent:
    build:
      context: .
      args:
        PRIME_AGENT_REPO: ${PRIME_AGENT_REPO:-https://github.com/PrimeIntellect-ai/prime-agent.git}
        PRIME_AGENT_REF: ${PRIME_AGENT_REF:-main}
    container_name: prime-agent
    volumes:
      - prime-data:/app/data
      # Mount the current directory as workspace for the agent to work on
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - TERM=xterm-256color
    command: ["--provider", "${PRIME_PROVIDER:-openrouter}", "--model", "${PRIME_MODEL:-meta-llama/llama-3.1-8b-instruct:free}"]

volumes:
  prime-data:
