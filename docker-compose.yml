services:
  node:
    build: .
    working_dir: /workspace
    env_file: .env
    environment:
      - OPENAI_BASE_URL=http://host.docker.internal:1234/v1
      - OPENAI_API_KEY=lm-studio
    volumes:
      - .:/workspace
      - ./.pi:/root/.pi/agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true